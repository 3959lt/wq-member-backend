{% extends 'base.html' %}{% block content %}<div class="auth card"><span class="tag">会员服务</span><h1>{{'创建账号' if register else '欢迎登录'}}</h1><p>管理套餐、订单与服务有效期。请使用注册邮箱登录。</p><form method="post"><input type="hidden" name="csrf" value="{{session.csrf}}"><label for="email">邮箱</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="username"><label for="password">密码{{'（至少 12 位）' if register}}</label><input id="password" name="password" type="password" required minlength="{{12 if register else 1}}" maxlength="128" autocomplete="{{'new-password' if register else 'current-password'}}"><p><button>{{'注册' if register else '登录'}}</button></p></form><a href="{{url_for('login' if register else 'register')}}">{{'已有账号，去登录' if register else '创建新账号'}}</a></div>{% endblock %}
