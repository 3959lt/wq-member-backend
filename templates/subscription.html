{% extends 'base.html' %}{% block content %}<div class="card"><h1>订阅链接</h1>{% if token %}<p>请复制并保存。此链接包含访问凭证，请勿转发。</p><input readonly value="{{url_for('subscription_download',token=token,_external=True)}}" aria-label="订阅链接"><p>SSH 隧道下生成的 localhost 链接仅适用于当前电脑。正式使用前需配置域名和 HTTPS，再重置链接。</p>{% else %}<p>为保护凭证，后台只保存令牌摘要。此浏览器没有可显示的链接，请生成新链接并保存。</p>{% endif %}<form method="post" action="/subscription/reset"><input type="hidden" name="csrf" value="{{session.csrf}}"><button>生成新链接（旧链接失效）</button></form></div>{% endblock %}
