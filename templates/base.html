<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WQ · 服务管理</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#182338;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#14233b;color:white;padding:20px 5%;display:flex;align-items:center;gap:24px;flex-wrap:wrap}header strong{font-size:22px}header a{color:#e1eaf9;text-decoration:none}header form{margin-left:auto}main{max-width:1160px;margin:32px auto;padding:0 22px}h1{font-size:30px;margin-bottom:8px}h2{font-size:20px}p,.muted{color:#62718a;line-height:1.7}.card{background:white;border:1px solid #e1e6ee;border-radius:16px;padding:24px;margin:20px 0;box-shadow:0 5px 20px #17243a05}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.grid .card{margin:0}.notice{background:#fff4db;color:#805c1a;padding:15px 20px;border-radius:10px;line-height:1.7}.flash{padding:14px;background:#e2f4ed;border-radius:9px;margin:12px 0}.flash.error{background:#ffe6e5;color:#973a35}label{display:block;font-size:14px;margin:16px 0 7px}input,textarea,select{width:100%;padding:11px 12px;border:1px solid #cbd4e2;border-radius:8px;font:inherit}textarea{min-height:150px;font-family:monospace}button,.button{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 15px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#e9edf5;color:#23324d}form.inline{display:inline-block;margin:3px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:13px 10px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}.scroll{overflow-x:auto}.tag{display:inline-block;padding:4px 9px;background:#e9edf5;border-radius:7px;font-size:12px}.price{font-size:32px;font-weight:700}.auth{max-width:450px;margin:50px auto}.small{font-size:13px}code{word-break:break-all}a{color:#2563eb}footer{text-align:center;padding:24px;color:#7f8ba0;font-size:12px}details{margin:15px 0}summary{cursor:pointer;font-weight:600}
</style></head><body><header><strong>WQ / 服务管理</strong>{% if g.user %}<a href="{{ url_for('dashboard') }}">会员中心</a>{% if g.user.role=='admin' %}<a href="{{ url_for('admin') }}">管理后台</a><a href="{{ url_for('nodes') }}">节点与订阅</a>{% endif %}<a href="{{ url_for('password') }}">修改密码</a><form action="/logout" method="post"><input type="hidden" name="csrf" value="{{session.csrf}}"><button class="secondary">退出</button></form>{% endif %}</header><main>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>WQ 服务后台 · 时间显示为北京时间 · 基础管理版本</footer></body></html>
